<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MeroX – AI Smart Mirror & Style Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- UI Styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:,">

  <!-- 🔥 Firebase v8 CDN (SAFE & STABLE) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
</head>

<body>

  <!-- 🌌 Background Glow -->
  <div class="bg-glow"></div>

  <!-- 🔐 AUTH SECTION -->
  <div class="container">
    <div class="auth-card" id="authCard" role="region" aria-label="MeroX Authentication">

      <h1>MeroX</h1>
      <p class="tagline">AI Powered Smart Mirror & Style Assistant</p>

      <!-- Feedback Alerts -->
      <div id="authError" class="auth-error hidden" role="alert"></div>
      <div id="authSuccess" class="auth-success hidden" role="status"></div>

      <!-- Navigation Tabs -->
      <div class="tabs" id="authTabs" role="tablist">
        <button id="loginTab" class="tab active" role="tab" aria-selected="true" aria-controls="loginForm">Login</button>
        <button id="signupTab" class="tab" role="tab" aria-selected="false" aria-controls="signupForm">Sign Up</button>
      </div>

      <!-- 1. LOGIN FORM -->
      <form id="loginForm" role="tabpanel" aria-labelledby="loginTab">
        <div class="input-wrap">
          <input type="email" id="loginEmail" placeholder="Email Address" required autocomplete="email" aria-label="Email Address" />
        </div>
        
        <div class="input-wrap pwd-wrap">
          <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password" aria-label="Password" />
          <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
        </div>

        <button type="submit" id="loginSubmitBtn" class="primary-auth-btn">Login to Dashboard</button>

        <div style="text-align: right; margin-top: -4px;">
          <button type="button" id="forgotPasswordLink" class="link-btn">Forgot Password?</button>
        </div>
      </form>

      <!-- 2. SIGNUP FORM -->
      <form id="signupForm" class="hidden" role="tabpanel" aria-labelledby="signupTab">
        <div class="input-wrap">
          <input type="text" id="signupName" placeholder="Full Name / Display Name" required autocomplete="name" aria-label="Full Name" />
        </div>

        <div class="input-wrap">
          <input type="email" id="signupEmail" placeholder="Email Address" required autocomplete="email" aria-label="Email Address" />
        </div>

        <div class="input-wrap pwd-wrap">
          <input type="password" id="signupPassword" placeholder="Create Password (min 6 chars)" required minlength="6" autocomplete="new-password" aria-label="Create Password" />
          <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('signupPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
        </div>

        <div class="input-wrap pwd-wrap">
          <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required minlength="6" autocomplete="new-password" aria-label="Confirm Password" />
          <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('signupConfirmPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
        </div>

        <button type="submit" id="signupSubmitBtn" class="primary-auth-btn">Create MeroX Account</button>
      </form>

      <!-- 3. FORGOT PASSWORD FORM -->
      <form id="forgotForm" class="hidden" role="region" aria-label="Reset Password">
        <p style="font-size: 13px; color: #cbd5e0; line-height: 1.4; margin-bottom: 8px;">
          Enter your registered email address to receive a secure password reset link.
        </p>

        <div class="input-wrap">
          <input type="email" id="forgotEmail" placeholder="Enter your email" required autocomplete="email" aria-label="Reset Email" />
        </div>

        <button type="submit" id="forgotSubmitBtn" class="primary-auth-btn">Send Reset Link</button>
        
        <button type="button" id="backToLoginBtn" class="link-btn" style="text-align: center; margin-top: 6px;">← Back to Login</button>
      </form>

      <!-- Guest Explorer Button -->
      <button type="button" id="guestBtn" class="guest-btn">Explore Dashboard as Guest →</button>

      <div class="premium">⭐ Personal Style Assistant • Free & Premium Access</div>
    </div>
  </div>

  <!-- Auth Service & Logic -->
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
