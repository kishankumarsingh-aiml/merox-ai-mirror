<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeroX Smart Mirror — Your Curated Look</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --emerald: #10b981;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .mobile-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header.look-header {
      text-align: center;
      padding: 16px 0 8px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-title span { color: #38bdf8; font-weight: 400; }
    .look-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .privacy-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--emerald);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 10px;
    }
    .look-summary-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    .summary-total { font-size: 24px; font-weight: 800; color: #a5b4fc; margin-top: 2px; }
    .store-pill {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 8px;
      text-align: right;
      color: var(--text-muted);
    }
    .store-pill strong { color: var(--text); display: block; }
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .item-img {
      width: 76px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background-color: #0f172a;
      flex-shrink: 0;
    }
    .item-details { flex: 1; min-width: 0; }
    .item-cat { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }
    .item-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 11px; color: var(--text-muted); margin: 2px 0 6px; }
    .item-price { font-size: 15px; font-weight: 800; color: #38bdf8; }
    .actions-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      color: white;
      transition: all 0.2s;
    }
    .btn-primary { background-color: #4f46e5; }
    .btn-primary:hover { background-color: #4338ca; }
    .btn-secondary { background-color: #1e293b; border: 1px solid var(--card-border); color: var(--text); }
    .btn-secondary:hover { background-color: #334155; }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      padding: 16px 0;
    }
    .error-card {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 24px;
      border-radius: var(--radius);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="mobile-container">

    <header class="look-header">
      <div class="brand-title">MeroX <span>Smart Mirror</span></div>
      <div class="look-subtitle" id="lookStoreName">Retail Fitting Room Lookbook</div>
      <div class="privacy-badge">
        <span>🔒</span> Anonymous Session • Zero Personal Data
      </div>
    </header>

    <div id="lookContent">
      <!-- Dynamically Populated -->
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        Loading curated look details...
      </div>
    </div>

    <div class="actions-box">
      <button type="button" class="btn btn-primary" onclick="shareCurrentLook()">
        <span>🔗</span> Share Look with Friends
      </button>
      <a href="search.html" class="btn btn-secondary">
        <span>🛍️</span> Explore Store Catalog
      </a>
    </div>

    <footer class="footer-note">
      Curated with MeroX AI Smart Mirror & Personal Style Assistant.<br>
      Single Authoritative Retail Catalog • Owner: Kishan Kumar Singh
    </footer>
  </div>

  <script src="products.js"></script>
  <script src="analytics.js"></script>
  <script src="session.js"></script>
  <script>
    (function () {
      "use strict";

      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      const urlParams = new URLSearchParams(window.location.search);
      const lookId = urlParams.get("id");
      const storeId = urlParams.get("store") || "STORE-MUM-01";
      const itemsParam = urlParams.get("items") || "";

      // Track QR opened event in privacy-safe store analytics
      if (window.MeroXAnalytics) {
        window.MeroXAnalytics.recordEvent("QR_OPENED", {
          lookId: lookId || "DIRECT_LINK",
          storeId: storeId
        });
      }

      // Resolve look from storage or reconstruct from itemsParam
      let look = null;
      if (window.MeroXSession && lookId) {
        look = window.MeroXSession.resolveLook(lookId);
      }

      if (!look && itemsParam && window.MeroXCatalog) {
        // Fallback: Reconstruct directly from catalog products
        const idList = itemsParam.split(",").map(Number).filter(Boolean);
        const resolvedItems = idList.map(id => window.MeroXCatalog.getById(id)).filter(Boolean);
        if (resolvedItems.length > 0) {
          const sum = resolvedItems.reduce((acc, p) => acc + (Number(p.price) || 0), 0);
          look = {
            lookId: lookId || "LK-SAVED",
            storeId: storeId,
            storeName: "MeroX Retail Kiosk",
            timestamp: new Date().toISOString(),
            items: resolvedItems,
            total: "₹" + sum.toLocaleString("en-IN"),
            totalNum: sum
          };
        }
      }

      const contentEl = document.getElementById("lookContent");
      const storeEl = document.getElementById("lookStoreName");

      if (!look || !look.items || look.items.length === 0) {
        contentEl.innerHTML = `
          <div class="error-card">
            <h3 style="margin-bottom: 8px; font-size: 16px;">Look Reference Unavailable</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 14px;">
              This fitting room look reference may have expired or was opened on a different browser.
            </p>
            <a href="search.html" class="btn btn-secondary" style="display:inline-flex;">
              Browse Store Collection
            </a>
          </div>
        `;
        return;
      }

      if (storeEl) {
        storeEl.textContent = `Curated at ${look.storeName || storeId}`;
      }

      const itemsHtml = look.items.map(item => `
        <div class="item-card">
          <img src="${escapeHtml(item.image || 'skin.jpg')}" alt="${escapeHtml(item.name)}" class="item-img" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%2276%22%20height%3D%2290%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23334155%22%2F%3E%3C%2Fsvg%3E'">
          <div class="item-details">
            <div class="item-cat">${escapeHtml(item.category)}</div>
            <div class="item-name">${escapeHtml(item.name)}</div>
            <div class="item-meta">
              SKU: <strong>${escapeHtml(item.sku || 'N/A')}</strong> ${item.size ? '• Size ' + escapeHtml(item.size) : ''}
            </div>
            <div class="item-price">₹${Number(item.price || 0).toLocaleString("en-IN")}</div>
          </div>
        </div>
      `).join("");

      contentEl.innerHTML = `
        <div class="look-summary-card">
          <div>
            <div class="summary-title">Curated Look Total</div>
            <div class="summary-total">${escapeHtml(look.total)}</div>
          </div>
          <div class="store-pill">
            <strong>${look.items.length} ${look.items.length === 1 ? 'Garment' : 'Garments'}</strong>
            ${escapeHtml(look.storeId || storeId)}
          </div>
        </div>

        <div class="items-list">
          ${itemsHtml}
        </div>
      `;

      window.shareCurrentLook = function () {
        if (navigator.share) {
          navigator.share({
            title: "My MeroX Smart Mirror Outfit Look",
            text: `Check out my curated store look (${look.items.length} items, ${look.total}) from MeroX Smart Mirror!`,
            url: window.location.href
          }).catch(() => {});
        } else {
          navigator.clipboard.writeText(window.location.href).then(() => {
            alert("✓ Look link copied to clipboard!");
          }).catch(() => {
            alert("Share URL: " + window.location.href);
          });
        }
      };

    })();
  </script>
</body>
</html>
