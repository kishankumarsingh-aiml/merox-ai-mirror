<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeroX – Search Results</title>
  <link rel="stylesheet" href="search.css">
  <link rel="icon" href="data:,">
</head>

<body>

<!-- ================= LOADER OVERLAY ================= -->
<div id="loader">
  <video autoplay muted loop playsinline onerror="hideLoader()">
    <source src="images/loader.mp4" type="video/mp4">
  </video>
  <p>Searching MeroX Collection...</p>
</div>

<!-- ================= TOPBAR ================= -->
<header class="search-header">
  <a href="dashboard.html" class="brand-back" title="Return to Dashboard">
    <button type="button" class="back-btn">← Dashboard</button>
    <h1>MeroX</h1>
  </a>

  <div class="search-bar-wrap">
    <form class="search-bar" id="searchForm" onsubmit="handleSearch(event)">
      <span class="search-icon">🔍</span>
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Search shirts, jeans, shoes, goggles, caps..." 
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>
  </div>
</header>

<!-- ================= FILTER PILLS ================= -->
<nav class="filter-row" aria-label="Category Filters">
  <button type="button" class="filter-pill active" data-cat="all" onclick="applyCategoryFilter('all')">All</button>
  <button type="button" class="filter-pill" data-cat="shirt" onclick="applyCategoryFilter('shirt')">Shirts</button>
  <button type="button" class="filter-pill" data-cat="tshirt" onclick="applyCategoryFilter('tshirt')">T-Shirts</button>
  <button type="button" class="filter-pill" data-cat="jeans" onclick="applyCategoryFilter('jeans')">Jeans</button>
  <button type="button" class="filter-pill" data-cat="shoe" onclick="applyCategoryFilter('shoe')">Shoes</button>
  <button type="button" class="filter-pill" data-cat="goggles" onclick="applyCategoryFilter('goggles')">Goggles</button>
  <button type="button" class="filter-pill" data-cat="cap" onclick="applyCategoryFilter('cap')">Caps</button>
</nav>

<!-- ================= MAIN CONTENT ================= -->
<main class="main-content">
  <div class="search-meta">
    <h2 id="title">Search Results</h2>
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="grid" id="results"></div>
</main>

<!-- Authoritative Products Catalog -->
<script src="products.js"></script>

<script>
  let currentResults = [];
  let isLoaderHidden = false;

  function hideLoader() {
    if (isLoaderHidden) return;
    isLoaderHidden = true;
    const loader = document.getElementById("loader");
    if (loader) {
      loader.classList.add("fade-out");
      setTimeout(() => {
        loader.style.display = "none";
      }, 300);
    }
  }

  function getQueryParam() {
    try {
      const params = new URLSearchParams(window.location.search);
      return (params.get("q") || "").trim();
    } catch (e) {
      return "";
    }
  }

  function updatePillsForQuery(query) {
    const q = (query || "").toLowerCase();
    document.querySelectorAll(".filter-pill").forEach(btn => {
      const label = btn.textContent.toLowerCase();
      if (!q || q === "all") {
        btn.classList.toggle("active", label === "all");
      } else {
        btn.classList.toggle("active", label === q || label.includes(q) || q.includes(label));
      }
    });
  }

  function renderProducts(items, queryText) {
    const box = document.getElementById("results");
    const titleEl = document.getElementById("title");
    const countEl = document.getElementById("resultCount");

    if (queryText && queryText.toLowerCase() !== "all") {
      titleEl.textContent = `Results for "${queryText}"`;
    } else {
      titleEl.textContent = "All Products";
    }

    countEl.textContent = `${items.length} item${items.length === 1 ? "" : "s"} found`;
    box.innerHTML = "";

    if (!items || items.length === 0) {
      box.innerHTML = `
        <div class="empty-state" style="grid-column: 1 / -1;">
          <span class="emoji">🔍</span>
          <h3>No matching products found</h3>
          <p>We couldn't find anything matching "${escapeHtml(queryText)}". Try one of these popular categories:</p>
          <div class="suggestions">
            <button type="button" onclick="executeSearch('shirts')" class="suggestion-chip">Shirts</button>
            <button type="button" onclick="executeSearch('t-shirt')" class="suggestion-chip">T-Shirts</button>
            <button type="button" onclick="executeSearch('jeans')" class="suggestion-chip">Jeans</button>
            <button type="button" onclick="executeSearch('shoes')" class="suggestion-chip">Shoes</button>
            <button type="button" onclick="executeSearch('goggles')" class="suggestion-chip">Goggles</button>
            <button type="button" onclick="executeSearch('caps')" class="suggestion-chip">Caps</button>
          </div>
        </div>
      `;
      return;
    }

    items.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";

      const imgWrap = document.createElement("div");
      imgWrap.className = "card-img-wrap";

      const img = document.createElement("img");
      img.src = p.image || p.img;
      img.alt = p.name;
      img.loading = "lazy";
      img.onerror = function () {
        this.onerror = null;
        this.src = window.MeroXCatalog ? window.MeroXCatalog.getImageFallback(p.category) : "";
      };
      imgWrap.appendChild(img);

      const categoryBadge = document.createElement("div");
      categoryBadge.className = "category-badge";
      categoryBadge.textContent = p.category;

      const title = document.createElement("h4");
      title.textContent = p.name;

      const priceRow = document.createElement("div");
      priceRow.className = "price-row";

      const price = document.createElement("span");
      price.className = "price";
      price.textContent = `₹${p.price.toLocaleString("en-IN")}`;

      const brand = document.createElement("span");
      brand.className = "brand";
      brand.textContent = p.brand || "MeroX";

      priceRow.appendChild(price);
      priceRow.appendChild(brand);

      card.appendChild(imgWrap);
      card.appendChild(categoryBadge);
      card.appendChild(title);
      card.appendChild(priceRow);

      if (p.category === "goggles" || p.category === "cap" || [1, 6, 11, 26].includes(p.id)) {
        const ctaRow = document.createElement("div");
        ctaRow.className = "card-cta-row";
        const tryBtn = document.createElement("button");
        tryBtn.type = "button";
        tryBtn.className = "tryon-cta";
        tryBtn.textContent = "Try On Live 🕶️";
        tryBtn.onclick = function(e) {
          e.stopPropagation();
          window.location.href = `dashboard.html?tryon=${p.id}`;
        };
        ctaRow.appendChild(tryBtn);
        card.appendChild(ctaRow);
      }

      card.onclick = function() {
        window.location.href = `dashboard.html?detail=${p.id}`;
      };

      box.appendChild(card);
    });
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, function(m) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m];
    });
  }

  let activeCategory = "all";

  function getQueryParams() {
    try {
      const params = new URLSearchParams(window.location.search);
      return {
        q: (params.get("q") || "").trim(),
        cat: (params.get("cat") || "").trim()
      };
    } catch (e) {
      return { q: "", cat: "" };
    }
  }

  function updatePillsForCategoryAndQuery(cat, query) {
    const activeCat = (cat || "all").toLowerCase();
    const q = (query || "").toLowerCase();
    
    document.querySelectorAll(".filter-pill").forEach(btn => {
      const pillCat = btn.getAttribute("data-cat") || btn.textContent.toLowerCase();
      if (activeCat !== "all") {
        btn.classList.toggle("active", pillCat.includes(activeCat) || activeCat.includes(pillCat));
      } else if (q && q !== "all") {
        btn.classList.toggle("active", pillCat === q || pillCat.includes(q) || q.includes(pillCat));
      } else {
        btn.classList.toggle("active", pillCat === "all");
      }
    });
  }

  // Continuous In-Page Search Engine
  function executeSearch(query, updateHistory = true, selectedCat = null) {
    if (selectedCat !== null) {
      activeCategory = selectedCat;
    }
    const q = (query !== undefined && query !== null) ? String(query).trim() : "";
    const searchInput = document.getElementById("searchInput");
    if (searchInput && query !== undefined && query !== null) {
      searchInput.value = (q && q.toLowerCase() !== "all") ? q : "";
    }

    // Auto-detect category from query if category is still 'all'
    if (activeCategory === "all" && q && q.toLowerCase() !== "all") {
      const lq = q.toLowerCase();
      if (["cap", "caps"].includes(lq)) activeCategory = "cap";
      else if (["shirt", "shirts"].includes(lq)) activeCategory = "shirt";
      else if (["tshirt", "tshirts", "t-shirt", "t-shirts", "tee", "tees"].includes(lq)) activeCategory = "tshirt";
      else if (["jean", "jeans", "denim"].includes(lq)) activeCategory = "jeans";
      else if (["shoe", "shoes", "sneaker", "sneakers"].includes(lq)) activeCategory = "shoe";
      else if (["goggles", "goggle", "glasses", "sunglasses"].includes(lq)) activeCategory = "goggles";
    }

    if (updateHistory) {
      const parts = [];
      if (q && q.toLowerCase() !== "all") parts.push(`q=${encodeURIComponent(q)}`);
      if (activeCategory && activeCategory !== "all") parts.push(`cat=${encodeURIComponent(activeCategory)}`);
      const newUrl = "search.html?" + (parts.length ? parts.join("&") : "q=all");
      try {
        window.history.pushState({ query: q, cat: activeCategory }, "", newUrl);
      } catch (e) {}
    }

    updatePillsForCategoryAndQuery(activeCategory, q);

    if (!window.MeroXCatalog) {
      console.error("MeroXCatalog is not available.");
      return;
    }

    let items = [];
    if (!q || q.toLowerCase() === "all") {
      if (activeCategory && activeCategory !== "all") {
        if (activeCategory === "shirt") {
          items = window.MeroXCatalog.getAll().filter(p => p.category === "shirt" || p.category === "tshirt");
        } else {
          items = window.MeroXCatalog.getByCategory(activeCategory);
        }
      } else {
        items = window.MeroXCatalog.getAll();
      }
    } else {
      items = window.MeroXCatalog.search(q);
      if (activeCategory && activeCategory !== "all") {
        if (activeCategory === "shirt") {
          items = items.filter(p => p.category === "shirt" || p.category === "tshirt");
        } else {
          items = items.filter(p => p.category === activeCategory);
        }
      }
    }

    currentResults = items;
    const displayText = (q && q.toLowerCase() !== "all") 
      ? q 
      : (activeCategory !== "all" ? activeCategory.charAt(0).toUpperCase() + activeCategory.slice(1) : "All");
    renderProducts(currentResults, displayText);
  }

  function handleSearch(e) {
    if (e && e.preventDefault) e.preventDefault();
    const input = document.getElementById("searchInput");
    const q = (input ? input.value : "").trim();
    // Re-evaluate category dynamically based on search
    activeCategory = "all";
    executeSearch(q || "all", true, "all");
  }

  function applyCategoryFilter(cat) {
    activeCategory = cat || "all";
    const input = document.getElementById("searchInput");
    let q = (input ? input.value : "").trim();
    // If the input was simply the previous category name, clear it to show all in this category
    const previousPillTexts = ["all", "shirt", "shirts", "tshirt", "t-shirt", "jeans", "shoe", "shoes", "goggles", "cap", "caps"];
    if (previousPillTexts.includes(q.toLowerCase())) {
      q = "";
      if (input) input.value = "";
    }
    executeSearch(q || "all", true, activeCategory);
  }

  // Handle browser back and forward button navigation
  window.addEventListener("popstate", () => {
    const params = getQueryParams();
    activeCategory = params.cat || "all";
    executeSearch(params.q || "all", false, activeCategory);
  });

  // Initialization
  document.addEventListener("DOMContentLoaded", () => {
    const params = getQueryParams();
    const rawQ = params.q;
    const rawCat = params.cat;
    if (rawCat) activeCategory = rawCat;

    const searchInput = document.getElementById("searchInput");
    if (searchInput && rawQ && rawQ.toLowerCase() !== "all") {
      searchInput.value = rawQ;
    }

    // Safety timeout for video loader: guarantees loader is dismissed even if video fails
    setTimeout(hideLoader, 400);

    // Initial search execution
    executeSearch(rawQ || "all", false, activeCategory);
  });
</script>

</body>
</html>
